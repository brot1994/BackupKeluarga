name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 belum diisi, APK ditandatangani dengan kunci debug"
          fi

      # Yang rahasia hanya file kuncinya (secret KEYSTORE_BASE64); password ini tidak berguna tanpa file itu.
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: mPhWYu3pbScdNn93tYziafjg
          KEY_ALIAS: backupkeluarga
          KEY_PASSWORD: mPhWYu3pbScdNn93tYziafjg
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Bungkus APK dalam .zip
        run: |
          VERSION="0.3.${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BackupKeluarga-v$VERSION.apk"
          (cd out && zip -j "../BackupKeluarga.zip" "BackupKeluarga-v$VERSION.apk")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: BackupKeluarga-v${{ env.VERSION }}
          path: out/*.apk

      - name: Pindahkan tag latest
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Backup Keluarga (terbaru)
          body: |
            Versi ${{ env.VERSION }} — commit ${{ github.sha }}
            Unduh **BackupKeluarga.zip**, ekstrak, lalu pasang APK di dalamnya.
          files: BackupKeluarga.zip
          make_latest: true
